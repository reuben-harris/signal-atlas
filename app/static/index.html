<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Atlas</title>
    <link
      href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }

      body {
        color: #172026;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .panel {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 2;
        width: min(340px, calc(100vw - 32px));
        border: 1px solid rgba(23, 32, 38, 0.16);
        border-radius: 8px;
        background: rgba(252, 253, 253, 0.94);
        box-shadow: 0 16px 40px rgba(23, 32, 38, 0.18);
        backdrop-filter: blur(8px);
      }

      .panel header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid rgba(23, 32, 38, 0.12);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .meta {
        margin-top: 4px;
        color: #5a6670;
        font-size: 13px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 14px 16px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #3a464f;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      select {
        width: 100%;
        min-width: 0;
        border: 1px solid #aab6bd;
        border-radius: 6px;
        background: #fff;
        color: #172026;
        font: inherit;
        font-size: 14px;
        padding: 8px 10px;
      }

      .legend {
        display: grid;
        gap: 8px;
        padding: 0 16px 14px;
      }

      .legend-row {
        display: grid;
        grid-template-columns: 16px 1fr auto;
        align-items: center;
        gap: 8px;
        color: #3a464f;
        font-size: 13px;
      }

      .swatch {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        border: 1px solid rgba(23, 32, 38, 0.18);
      }

      .empty {
        display: none;
        padding: 0 16px 14px;
        color: #6c3f00;
        font-size: 13px;
      }

      .empty.visible {
        display: block;
      }

      .maplibregl-popup-content {
        border-radius: 8px;
        box-shadow: 0 14px 36px rgba(23, 32, 38, 0.22);
        font: 13px/1.45 Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .popup-title {
        margin-bottom: 6px;
        font-weight: 700;
      }

      .popup-grid {
        display: grid;
        grid-template-columns: auto auto;
        gap: 3px 12px;
      }

      .popup-grid span:nth-child(odd) {
        color: #5a6670;
      }

      @media (max-width: 640px) {
        .panel {
          top: 10px;
          left: 10px;
          width: calc(100vw - 20px);
        }

        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <section class="panel" aria-label="Signal Atlas controls">
      <header>
        <h1>Signal Atlas</h1>
        <div class="meta" id="selectionMeta">Loading signal layers</div>
      </header>
      <div class="controls">
        <label>
          Provider
          <select id="providerSelect" disabled></select>
        </label>
        <label>
          RAT
          <select id="ratSelect" disabled></select>
        </label>
      </div>
      <div class="legend" aria-label="Signal quality legend">
        <div class="legend-row">
          <span class="swatch" style="background: #00b51a"></span>
          <span>Excellent</span>
          <span>&ge; -85 dBm</span>
        </div>
        <div class="legend-row">
          <span class="swatch" style="background: #65d928"></span>
          <span>Good</span>
          <span>-100 to -85</span>
        </div>
        <div class="legend-row">
          <span class="swatch" style="background: #f0d300"></span>
          <span>Fair</span>
          <span>-110 to -100</span>
        </div>
        <div class="legend-row">
          <span class="swatch" style="background: #f0441f"></span>
          <span>Poor</span>
          <span>&lt; -110</span>
        </div>
      </div>
      <div class="empty" id="emptyState">No processed signal cells are available.</div>
    </section>
    <script>
      const signalColors = [
        "match",
        ["get", "quality_bucket"],
        "excellent",
        "#00b51a",
        "good",
        "#65d928",
        "fair",
        "#f0d300",
        "poor",
        "#f0441f",
        "#4f5b46",
      ];

      const baseStyle = {
        version: 8,
        name: "Signal Atlas OSM Vector",
        glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
        sources: {
          osm: {
            type: "vector",
            url: "https://vector.openstreetmap.org/shortbread_v1/tilejson.json",
            attribution: "&copy; OpenStreetMap contributors",
          },
        },
        layers: [
          {
            id: "background",
            type: "background",
            paint: { "background-color": "#edf1f2" },
          },
          {
            id: "ocean",
            type: "fill",
            source: "osm",
            "source-layer": "ocean",
            paint: { "fill-color": "#b7d7e8" },
          },
          {
            id: "water",
            type: "fill",
            source: "osm",
            "source-layer": "water_polygons",
            paint: { "fill-color": "#a9d0e3" },
          },
          {
            id: "land",
            type: "fill",
            source: "osm",
            "source-layer": "land",
            paint: {
              "fill-color": [
                "match",
                ["get", "kind"],
                "forest",
                "#b7d3aa",
                "park",
                "#cde4b3",
                "industrial",
                "#d8d2ca",
                "commercial",
                "#ddd0d1",
                "residential",
                "#e7e3dc",
                "#e5e1d7",
              ],
              "fill-opacity": 0.78,
            },
          },
          {
            id: "streets-casing",
            type: "line",
            source: "osm",
            "source-layer": "streets",
            paint: {
              "line-color": "#c7bca9",
              "line-width": ["interpolate", ["linear"], ["zoom"], 8, 0.5, 14, 5],
            },
          },
          {
            id: "streets",
            type: "line",
            source: "osm",
            "source-layer": "streets",
            paint: {
              "line-color": "#fffdf7",
              "line-width": ["interpolate", ["linear"], ["zoom"], 8, 0.25, 14, 3],
            },
          },
          {
            id: "buildings",
            type: "fill",
            source: "osm",
            "source-layer": "buildings",
            minzoom: 14,
            paint: {
              "fill-color": "#c8c0b6",
              "fill-opacity": 0.55,
            },
          },
          {
            id: "places",
            type: "symbol",
            source: "osm",
            "source-layer": "place_labels",
            layout: {
              "text-field": ["coalesce", ["get", "name_en"], ["get", "name"]],
              "text-font": ["Open Sans Regular"],
              "text-size": ["interpolate", ["linear"], ["zoom"], 4, 11, 12, 15],
              "text-variable-anchor": ["top", "bottom", "left", "right"],
              "text-radial-offset": 0.5,
              "text-padding": 2,
            },
            paint: {
              "text-color": "#37444d",
              "text-halo-color": "#f8f7f2",
              "text-halo-width": 1.2,
            },
          },
        ],
      };

      const map = new maplibregl.Map({
        container: "map",
        style: baseStyle,
        center: [174.775847, -41.3407129],
        zoom: 13,
        attributionControl: true,
      });

      map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

      const providerSelect = document.getElementById("providerSelect");
      const ratSelect = document.getElementById("ratSelect");
      const selectionMeta = document.getElementById("selectionMeta");
      const emptyState = document.getElementById("emptyState");
      let combinations = [];

      map.on("load", async () => {
        map.addSource("signal-atlas", {
          type: "vector",
          url: "/tilejson/signal.json",
        });

        map.addLayer({
          id: "signal-cells-fill",
          type: "fill",
          source: "signal-atlas",
          "source-layer": "signal_cells",
          paint: {
            "fill-antialias": false,
            "fill-color": signalColors,
            "fill-opacity": ["interpolate", ["linear"], ["zoom"], 4, 0.78, 16, 0.66],
          },
        });

        map.addLayer({
          id: "signal-cells-outline",
          type: "line",
          source: "signal-atlas",
          "source-layer": "signal_cells",
          paint: {
            "line-color": "#203020",
            "line-opacity": ["interpolate", ["linear"], ["zoom"], 6, 0, 13, 0.1, 16, 0.2],
            "line-width": ["interpolate", ["linear"], ["zoom"], 6, 0, 13, 0.35, 16, 0.7],
          },
        });

        map.on("click", "signal-cells-fill", (event) => {
          const feature = event.features && event.features[0];
          if (!feature) {
            return;
          }
          const p = feature.properties;
          new maplibregl.Popup()
            .setLngLat(event.lngLat)
            .setHTML(
              `<div class="popup-title">${p.provider} ${String(p.rat).toUpperCase()}</div>
               <div class="popup-grid">
                 <span>Quality</span><strong>${p.quality_bucket}</strong>
                 <span>Average</span><strong>${Number(p.avg_dbm).toFixed(1)} dBm</strong>
                 <span>Samples</span><strong>${p.sample_count}</strong>
                 <span>Metric</span><strong>${p.metric_name}</strong>
                 <span>Grid</span><strong>${p.grid_size_m} m</strong>
               </div>`
            )
            .addTo(map);
        });

        map.on("mouseenter", "signal-cells-fill", () => {
          map.getCanvas().style.cursor = "pointer";
        });
        map.on("mouseleave", "signal-cells-fill", () => {
          map.getCanvas().style.cursor = "";
        });

        await loadOptions();
      });

      providerSelect.addEventListener("change", () => {
        renderRatOptions();
        applySignalFilter();
      });

      ratSelect.addEventListener("change", applySignalFilter);

      async function loadOptions() {
        const response = await fetch("/api/signal/options");
        const options = await response.json();
        combinations = options.combinations || [];
        renderProviderOptions();
        renderRatOptions();
        applySignalFilter();
      }

      function renderProviderOptions() {
        const providers = [...new Set(combinations.map((item) => item.provider))];
        providerSelect.replaceChildren(
          ...providers.map((provider) => option(provider, provider))
        );
        providerSelect.disabled = providers.length === 0;
        emptyState.classList.toggle("visible", providers.length === 0);
      }

      function renderRatOptions() {
        const provider = providerSelect.value;
        const rats = [
          ...new Set(
            combinations
              .filter((item) => item.provider === provider)
              .map((item) => item.rat)
          ),
        ];
        ratSelect.replaceChildren(
          ...rats.map((rat) => option(rat, rat.toUpperCase()))
        );
        ratSelect.disabled = rats.length === 0;
      }

      function option(value, label) {
        const element = document.createElement("option");
        element.value = value;
        element.textContent = label;
        return element;
      }

      function applySignalFilter() {
        const provider = providerSelect.value;
        const rat = ratSelect.value;
        const hasSelection = provider && rat;
        const filter = hasSelection
          ? [
              "all",
              ["==", ["get", "provider"], provider],
              ["==", ["get", "rat"], rat],
            ]
          : ["==", ["get", "provider"], "__none__"];

        if (map.getLayer("signal-cells-fill")) {
          map.setFilter("signal-cells-fill", filter);
          map.setFilter("signal-cells-outline", filter);
        }

        const match = combinations.find(
          (item) => item.provider === provider && item.rat === rat
        );
        selectionMeta.textContent = match
          ? `${match.cell_count} processed cells`
          : "No processed cells for this selection";
      }
    </script>
  </body>
</html>
